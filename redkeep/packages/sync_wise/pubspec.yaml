name: sync_wise
description: "WhatsApp-style Google Drive backup for Flutter apps: resumable, verified SQLite snapshots and files, scheduled with WorkManager."
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=1.17.0"

dependencies:
  connectivity_plus: ^7.3.2
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.0
  flutter_riverpod: ^3.4.3
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.5
  sqlite3: 3.6.0
  uuid: ^4.5.1
  workmanager: 0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
