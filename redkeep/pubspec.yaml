name: redkeep
description: "Redkeep mobile writing app."
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: ^3.13.4

dependencies:
  file_picker: ^13.1.0
  open_filex: ^5.0.0
  mime: ^2.0.0
  sync_wise:
    path: packages/sync_wise
  workmanager: 0.10.10
  flutter_secure_storage: 11.2.0
  mobile_scanner: 7.4.2
  sqlite3: 3.6.0
  crypto: ^3.0.6
  drift: ^2.35.3
  flutter:
    sdk: flutter
  flutter_markdown_plus: 1.0.12
  flutter_native_splash: 2.4.8
  flutter_riverpod: ^3.4.3
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^18.1.2
  google_fonts: 9.0.0
  http: ^1.6.0
  image_picker: 1.2.4
  uuid: 4.6.0
  path: 1.9.1
  image: 4.12.0
  flutter_image_compress: 2.5.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  url_launcher: 6.3.3
  flutter_quill: 11.6.0
  flutter_localizations:
    sdk: flutter
  markdown: 7.3.1
  emoji_picker_flutter: ^4.5.4
  cached_network_image: ^4.0.7
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/presentation-v1.json
    - assets/branding/grand_maestar.png
    - assets/branding/ink-paper.webp
