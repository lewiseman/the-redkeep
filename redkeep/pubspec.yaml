name: redkeep
description: "Redkeep mobile writing app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  sync_wise:
    path: packages/sync_wise
  crypto: ^3.0.6
  drift: ^2.35.3
  flutter:
    sdk: flutter
  flutter_edge_ai: 2.5.5
  flutter_edge_ai_litertlm: 1.19.1
  flutter_markdown_plus: 1.0.12
  flutter_native_splash: 2.4.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  google_fonts: 9.0.0
  image: 4.12.0
  path_provider: ^2.1.6
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/presentation-v1.json
    - assets/branding/grand_maestar.png
    - assets/branding/ink-paper.webp
    - assets/licenses/Allura-OFL.txt
