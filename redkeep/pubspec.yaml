name: redkeep
description: "Redkeep mobile writing app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  html: 0.15.7
  file_picker: ^13.1.0
  open_filex: ^5.0.0
  mime: ^2.0.0
  webview_flutter: ^4.14.1
  sync_wise:
    path: packages/sync_wise
  bonsoir: 7.1.6
  cryptography: 2.9.0
  flutter_secure_storage: 11.2.0
  mobile_scanner: 7.4.2
  flutter_tts: 4.2.5
  flutter_edge_ai_rag: 1.1.2
  flutter_edge_ai_sqlite: 2.1.1
  sqlite3: 3.6.0
  crypto: ^3.0.6
  drift: ^2.35.3
  flutter:
    sdk: flutter
  flutter_markdown_plus: 1.0.12
  flutter_native_splash: 2.4.8
  flutter_riverpod: ^3.4.3
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^18.1.2
  google_fonts: 9.0.0
  http: ^1.6.0
  image_picker: 1.2.4
  uuid: 4.6.0
  path: 1.9.1
  image: 4.12.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/presentation-v1.json
    - assets/branding/grand_maestar.png
    - assets/branding/ink-paper.webp
